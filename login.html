<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoDrive - Account</title>
    <link rel="stylesheet" href="/CARS/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="container">

        <h2>EcoDrive Account</h2>

        <div class="tabs">
            <div class="tab active" onclick="showForm('login')">Login</div>
            <div class="tab" onclick="showForm('register')">Create Account</div>
        </div>

        <!-- Login -->
        <form id="login" class="active" method="post">

            <input id="email" type="email" placeholder="Email" required name="email">
            <input type="password" placeholder="Password" required minlength="8" name="password">
            <input class="submit" type="submit"></input>
            <small>Welcome back to EcoDrive</small>
        </form>

        <!-- Register -->
        <form id="register" method="post">
            <input type="text" placeholder="Full Name" required name="full name">
            <input type="email" placeholder="Email" required name="email">
            <input type="password" placeholder="Password" required minlength="8" name="password">
            <input class="submit" type="submit" value="Create Account"></input>
            <small>Join EcoDrive today</small>
        </form>

    </div>

    <script>
        function showForm(type) {
            document.getElementById("login").classList.remove("active");
            document.getElementById("register").classList.remove("active");

            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

            if (type === "login") {
                document.getElementById("login").classList.add("active");
                document.querySelectorAll(".tab")[0].classList.add("active");
            } else {
                document.getElementById("register").classList.add("active");
                document.querySelectorAll(".tab")[1].classList.add("active");
            }
        }
    </script>

</body>

</html>
